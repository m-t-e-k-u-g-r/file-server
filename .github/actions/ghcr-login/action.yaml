name: ghcr-login
description: Authenticate Docker with GHCR
inputs:
  username:
    description: Github Username
    required: true
  token:
    description: GHCR token
    required: true
runs:
  using: composite
  steps:

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}