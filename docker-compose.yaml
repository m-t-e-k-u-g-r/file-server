services:
  server:
    image: ghcr.io/m-t-e-k-u-g-r/file-server:latest
    build: .
    environment:
      ADMIN_INITIAL_PWD: ${ADMIN_INITIAL_PWD}
      DB_HOST: database
      DATABASE: ${DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DATABASE}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/docker

volumes:
  data: