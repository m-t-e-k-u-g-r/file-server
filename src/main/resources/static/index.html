<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Console</title>
    <script defer src="admin.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
</head>
<body>
    <main class="container">
        <h1>Admin</h1>
        <!-- Token verification -->
        <section class="card" id="verification">
            <h2>Verify token</h2>
            <form name="verify">
                <div class="form-group">
                    <label for="token">Token</label>
                    <input type="password" id="token" name="token"
                           placeholder="Enter admin token"
                           autocomplete="off" required
                    />
                </div>
                <button type="submit">Verify</button>
                <p class="info">Status: <span id="status">not verified</span></p>
            </form>
        </section>
        <div id="verified-actions">
            <!-- File upload -->
            <section class="card">
                <h2>File Upload</h2>
                <form enctype="multipart/form-data" name="upload">
                    <div class="form-group">
                        <label for="file-upload">File</label>
                        <input type="file" id="file-upload" name="file"/>
                    </div>
                    <button type="submit">Upload</button>
                </form>
                <div class="info">
                    <p id="upload-error"></p>
                </div>
            </section>
            <!-- Create access Key -->
            <section class="card">
                <h2>Create Access Key</h2>
                <form name="create">
                    <div class="form-group">
                        <label for="fileId">File ID</label>
                        <input type="text" id="fileId" name="fileId" placeholder="File ID"/>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" name="description" placeholder="Description"/>
                    </div>
                    <button type="submit">Create access key</button>
                </form>
                <div class="info">
                    <p id="creation-error"></p>
                </div>
                <div id="qrcode"></div>
            </section>
        </div>
    </main>
</body>
</html>
